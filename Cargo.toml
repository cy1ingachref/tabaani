[workspace]
resolver = "2"
members = [
    "crates/transit-core",
    "tools/gtfs-builder",
    "tools/replay",
    "tools/simulator",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
transit-core = { path = "crates/transit-core" }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
