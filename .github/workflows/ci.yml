name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  lint:
    name: workflow lint (actionlint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
      - name: actionlint
        run: |
          curl -sL -o /tmp/actionlint.tar.gz \
            https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz
          tar xzf /tmp/actionlint.tar.gz -C /tmp
          /tmp/actionlint -color .github/workflows/*.yml

  rust:
    name: rust (fmt, clippy, test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # HEAD (2026-11)
        with:
          toolchain: stable
          components: clippy, rustfmt
      - name: fmt
        run: cargo fmt --all -- --check
      - name: clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: test
        run: cargo test --workspace

  replay:
    name: replay gate (matcher accuracy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # HEAD (2026-11)
        with:
          toolchain: stable
      - name: build dataset + traces + score
        run: |
          cargo run -q -p gtfs-builder -- data/tab_seed.json data/gtfs/build
          cargo run -q -p simulator -- data/gtfs/build/0.1.0-dev data/traces
          cargo run -q -p replay -- data/traces tools/replay/thresholds.toml

  data:
    name: gtfs sanity (structural checks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: build GTFS
        run: cargo run -q -p gtfs-builder -- data/tab_seed.json data/gtfs/build
      - name: structural checks
        run: |
          python - <<'PY'
          import csv, pathlib, sys
          root = pathlib.Path('data/gtfs/build')
          dirs = sorted(p for p in root.iterdir() if p.is_dir())
          assert dirs, 'no dataset version directory produced'
          d = dirs[-1]
          required = ['agency.txt','stops.txt','routes.txt','trips.txt','stop_times.txt','shapes.txt','calendar.txt']
          missing = [f for f in required if not (d / f).exists()]
          assert not missing, f'missing {missing} in {d}'
          stops = list(csv.DictReader((d/'stops.txt').open()))
          trips = list(csv.DictReader((d/'trips.txt').open()))
          st = list(csv.DictReader((d/'stop_times.txt').open()))
          assert len(stops) >= 2, 'too few stops'
          assert trips, 'no trips'
          assert st, 'no stop times'
          bad = [r for r in st if not r.get('shape_dist_traveled')]
          assert not bad, f'{len(bad)} stop_times lack shape_dist_traveled'
          print(f'data ok: {d.name} stops={len(stops)} trips={len(trips)} stop_times={len(st)}')
          PY

  e2e:
    name: live end-to-end (ingest -> matcher -> /v1/live)
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      REDIS_URL: redis://127.0.0.1:6379
      GTFS_DIR: data/gtfs/build/0.1.0-dev
      API_WS: ws://127.0.0.1:8080
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # HEAD (2026-11)
        with:
          toolchain: stable
      - name: build dataset and binaries
        run: |
          cargo run -q -p gtfs-builder -- data/tab_seed.json data/gtfs/build
          cargo build -q -p api -p matcher -p e2e
      - name: start api + matcher
        run: |
          ./target/debug/api > /tmp/tabaani-api.log 2>&1 &
          sleep 2
          ./target/debug/matcher > /tmp/tabaani-matcher.log 2>&1 &
          sleep 3
          curl -sf http://127.0.0.1:8080/healthz
      - name: run e2e
        run: cargo run -q -p e2e

  secrets:
    name: secrets scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
        with:
          fetch-depth: 0
      - name: gitleaks
        uses: gitleaks/gitleaks-action@dcedce43c6f43de0b836d1fe38946645c9c638dc # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
