name: tabaani
description: "Tabaani live transit tracker — rider fix logger and live vehicle viewer."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.4

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  # Native MapLibre renderer (Android/iOS) with a web fallback implementation.
  maplibre: ^0.4.0
  # Binary WebSocket frames: the backend speaks protobuf over WS binary.
  web_socket_channel: ^3.0.3
  # Minimal state management.
  provider: ^6.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
